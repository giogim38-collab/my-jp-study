<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>양봉장 통합 관리</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
      background: #f4f6f3;
      color: #1e293b;
      padding: 12px;
      max-width: 960px;
      margin: 0 auto;
      font-size: 14px;
      line-height: 1.4;
    }
    header {
      background: #1b5e20;
      color: #fff;
      padding: 14px 16px;
      border-radius: 12px;
      margin-bottom: 12px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }
    h1 { font-size: 19px; }
    .sub-status { font-size: 12px; opacity: 0.92; }

    .screen { display: none; }
    .screen.active { display: block; }

    .panel {
      background: #fff;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .panel-title {
      font-size: 15px;
      font-weight: 800;
      color: #1b5e20;
      margin-bottom: 10px;
    }
    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .collapsible-box {
      display: none;
      width: 100%;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed #cbd5e1;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .collapsible-box.open { display: flex; }

    select, input, textarea, button {
      font-family: inherit;
      font-size: 14px;
      padding: 9px 12px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
    }
    button {
      background: #2e7d32;
      color: #fff;
      border: none;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
    }
    button:active { opacity: 0.85; }
    button.secondary { background: #475569; }
    button.danger { background: #dc2626; }
    button.outline-green {
      background: #e8f5e9;
      color: #1b5e20;
      border: 1px solid #2e7d32;
    }
    button.tab-btn {
      background: #e2e8f0;
      color: #1e293b;
    }
    button.tab-btn.active {
      background: #1b5e20;
      color: #fff;
    }
    .visually-hidden-file {
      position: fixed;
      left: -9999px;
      top: 0;
      width: 1px;
      height: 1px;
      opacity: 0.01;
    }

    /* 봉장 선택 카드 목록: 모바일 2열 */
    .apiary-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 12px;
    }
    @media (min-width: 640px) {
      .apiary-list {
        grid-template-columns: repeat(3, 1fr);
      }
    }
    .apiary-card {
      background: #fff;
      border: 2px solid #cbd5e1;
      border-radius: 10px;
      padding: 12px;
      cursor: pointer;
      transition: transform 0.1s, border-color 0.1s;
    }
    .apiary-card:hover {
      transform: translateY(-2px);
      border-color: #2e7d32;
    }
    .apiary-card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
    }
    .apiary-name {
      font-size: 16px;
      font-weight: 800;
      color: #0f172a;
    }
    .apiary-badge {
      background: #e8f5e9;
      color: #1b5e20;
      font-weight: 800;
      font-size: 13px;
      padding: 3px 8px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .apiary-sub {
      font-size: 13px;
      color: #475569;
      font-weight: 600;
      line-height: 1.45;
    }
    .apiary-sub.has-issue {
      color: #b45309;
      font-weight: 700;
    }
    .apiary-alert-text {
      margin-top: 4px;
      font-size: 13px;
      font-weight: 800;
      color: #dc2626;
    }

    /* 벌통 화면 상단 바 */
    .top-nav {
      background: #fff;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 10px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .current-apiary-title {
      font-size: 18px;
      font-weight: 800;
      color: #1b5e20;
    }

    .summary {
      display: grid;
      grid-template-columns: 1fr 2.2fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    @media (max-width: 520px) {
      .summary {
        grid-template-columns: repeat(2, 1fr);
      }
      .summary .stat.wide-stat {
        grid-column: 1 / -1;
        order: 3;
      }
    }
    .stat {
      background: #fff;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
    }
    .stat span { display: block; font-size: 12px; color: #475569; font-weight: 700; margin-bottom: 2px; }
    .stat strong { font-size: 19px; color: #1b5e20; }
    .stat strong.status-detail {
      font-size: 14px;
      line-height: 1.45;
      display: block;
      word-break: keep-all;
    }
    .stat strong.danger-text { color: #dc2626; }
    .stat strong.warn-text { color: #b45309; }

    /* 벌통 카드: 핸드폰에서 한 줄에 2개 배치 */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
    @media (min-width: 680px) {
      .grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
      }
    }
    @media (min-width: 900px) {
      .grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }
    .hive-card {
      background: #fff;
      border: 2px solid #cbd5e1;
      border-radius: 10px;
      padding: 10px;
      cursor: pointer;
      transition: transform 0.1s;
      min-width: 0;
    }
    .hive-card:hover { transform: translateY(-2px); border-color: #2e7d32; }
    .hive-card.inspect-needed {
      border-color: #2563eb;
      background: #eff6ff;
      box-shadow: 0 0 0 1px rgba(37, 99, 235, 0.25);
    }
    .hive-card.focus-active {
      border-color: #7c3aed;
      background: #f5f3ff;
      box-shadow: 0 0 0 1px rgba(124, 58, 237, 0.25);
    }
    .hive-card.alert { border-color: #dc2626; background: #fef2f2; }
    .hive-card.caution { border-color: #d97706; background: #fffbeb; }

    .hive-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 4px;
      padding-bottom: 6px;
      margin-bottom: 8px;
      border-bottom: 1px solid #e2e8f0;
      flex-wrap: wrap;
    }
    .hive-num { font-weight: 800; font-size: 16px; color: #0f172a; }
    .header-controls {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin-left: auto;
    }
    .focus-chip {
      font-size: 11px;
      font-weight: 800;
      padding: 3px 6px;
      border-radius: 6px;
      border: 1px solid #94a3b8;
      background: #f1f5f9;
      color: #334155;
      cursor: pointer;
      line-height: 1.2;
      white-space: nowrap;
    }
    .focus-chip.is-active {
      background: #7c3aed;
      border-color: #6d28d9;
      color: #fff;
    }
    .inspect-control {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      user-select: none;
    }
    .inspect-label {
      font-size: 11px;
      font-weight: 800;
      color: #0f172a;
    }
    .inspect-toggle {
      display: inline-grid;
      grid-template-columns: 1fr 1fr;
      width: 32px;
      height: 17px;
      padding: 2px;
      border-radius: 999px;
      background: #e2e8f0;
      border: 1px solid #94a3b8;
      cursor: pointer;
      align-items: center;
      gap: 2px;
    }
    .inspect-toggle.is-active {
      background: #dbeafe;
      border-color: #2563eb;
    }
    .inspect-dot {
      width: 100%;
      height: 100%;
      border-radius: 999px;
      background: transparent;
      transition: background-color 0.12s ease;
    }
    .inspect-toggle:not(.is-active) .inspect-dot.left {
      background: #64748b;
    }
    .inspect-toggle.is-active .inspect-dot.right {
      background: #2563eb;
    }

    .focus-banner {
      background: #ede9fe;
      border: 1px solid #c4b5fd;
      color: #4c1d95;
      border-radius: 7px;
      padding: 5px 7px;
      margin-bottom: 7px;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.35;
      word-break: break-word;
    }
    .focus-banner-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 4px;
      font-weight: 800;
      color: #5b21b6;
    }
    .focus-dday {
      background: #6d28d9;
      color: #fff;
      font-size: 11px;
      padding: 1px 5px;
      border-radius: 4px;
      white-space: nowrap;
    }
    .focus-banner-note {
      margin-top: 2px;
      font-size: 12px;
      color: #3b0764;
      font-weight: 600;
    }

    .hive-lines {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 14px;
      color: #1e293b;
    }
    .hive-line {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 6px;
    }
    .hive-line-key {
      color: #0f172a;
      font-weight: 800;
      flex-shrink: 0;
    }
    .hive-line-val {
      font-weight: 600;
      color: #1e293b;
      text-align: right;
      word-break: break-word;
    }
    .hive-note-box {
      margin-top: 5px;
      padding-top: 5px;
      border-top: 1px dashed #cbd5e1;
      font-size: 13px;
      color: #0f172a;
      font-weight: 600;
      word-break: break-word;
    }

    .stats-wrap { display: grid; gap: 12px; }
    .stats-card {
      background: #fff;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      padding: 14px;
    }
    .stats-card h3 {
      font-size: 16px;
      color: #1b5e20;
      margin-bottom: 10px;
    }
    .stat-row {
      padding: 8px 0;
      border-bottom: 1px solid #f1f5f9;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .stat-row:last-child { border-bottom: none; }
    .stat-row-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      font-weight: 700;
    }
    .bar-bg {
      width: 100%;
      height: 10px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      background: #2e7d32;
      border-radius: 999px;
    }
    .bar-fill.info { background: #2563eb; }
    .bar-fill.warn { background: #d97706; }
    .bar-fill.alert { background: #dc2626; }
    .hive-list-text {
      font-size: 12px;
      color: #475569;
      line-height: 1.4;
    }

    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.45);
      display: none; align-items: center; justify-content: center; padding: 12px; z-index: 50;
    }
    .modal {
      background: #fff; width: 100%; max-width: 520px; border-radius: 12px;
      padding: 18px; max-height: 90vh; overflow-y: auto;
    }
    .field { margin-bottom: 10px; }
    .field label { display: block; font-size: 14px; font-weight: 800; color: #0f172a; margin-bottom: 4px; }
    .field input, .field select, .field textarea { width: 100%; }
    .modal-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
      flex-wrap: wrap;
    }
    .modal-actions-right { display: flex; gap: 8px; margin-left: auto; }

    /* 집중관리 전용 팝업 스타일 */
    .type-btn-group {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 10px;
    }
    .type-choice-btn {
      background: #f1f5f9;
      color: #1e293b;
      border: 1px solid #cbd5e1;
      padding: 8px 6px;
      font-size: 13px;
      font-weight: 700;
      border-radius: 8px;
      text-align: center;
      position: relative;
    }
    .type-choice-btn.has-saved-date::after {
      content: " · 날짜있음";
      font-size: 11px;
      font-weight: 800;
      color: #6d28d9;
    }
    .type-choice-btn.selected {
      background: #7c3aed;
      color: #fff;
      border-color: #6d28d9;
    }
    .type-choice-btn.selected.has-saved-date::after {
      color: #ede9fe;
    }
    .draft-hint {
      font-size: 12px;
      color: #5b21b6;
      background: #f5f3ff;
      border: 1px solid #ddd6fe;
      border-radius: 7px;
      padding: 6px 9px;
      margin-bottom: 10px;
      line-height: 1.35;
    }
    .focus-history-box {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid #e2e8f0;
    }
    .focus-history-title {
      font-size: 14px;
      font-weight: 800;
      color: #4c1d95;
      margin-bottom: 8px;
    }
    .focus-log-item {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }
    .focus-log-main {
      font-size: 13px;
      line-height: 1.4;
    }
    .focus-log-head {
      font-weight: 800;
      color: #1e293b;
    }
    .focus-log-desc {
      color: #475569;
      margin-top: 2px;
      word-break: break-word;
    }
    .focus-log-del {
      background: #fee2e2;
      color: #b91c1c;
      border: 1px solid #fecaca;
      padding: 4px 8px;
      font-size: 12px;
      border-radius: 6px;
      flex-shrink: 0;
    }
    .focus-cum-item {
      background: #faf5ff;
      border-left: 3px solid #7c3aed;
      border-top: 1px solid #ede9fe;
      border-right: 1px solid #ede9fe;
      border-bottom: 1px solid #ede9fe;
      border-radius: 6px;
      padding: 7px 10px;
      margin-bottom: 6px;
      font-size: 13px;
    }
    .focus-cum-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      font-weight: 800;
      color: #4c1d95;
    }
    .focus-cum-body {
      color: #1e293b;
      margin-top: 2px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .add-entry-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    .mini-btn {
      padding: 5px 10px;
      font-size: 12px;
      border-radius: 6px;
      background: #ede9fe;
      color: #5b21b6;
      border: 1px solid #c4b5fd;
    }
  </style>
</head>
<body>
  <header>
    <h1>🐝 양봉장 통합 관리</h1>
    <div id="syncStatus" class="sub-status">로컬 저장 모드 · 폴더: beekeeper (최근 10개 유지)</div>
  </header>

  <!-- 1. 앞 화면: 전체 요약 + 봉장 선택 및 관리/백업/복원 -->
  <section id="apiaryScreen" class="screen active">
    <div class="summary" id="frontSummaryBox"></div>

    <div class="panel">
      <div class="panel-title">봉장 선택 (누르면 벌통 카드를 봅니다)</div>
      <div id="apiaryListBox" class="apiary-list"></div>
      <div class="btn-row">
        <button type="button" class="outline-green" id="toggleAddApiaryBtn">+ 새 봉장 추가</button>
        <button type="button" class="secondary" id="toggleRenameApiaryBtn">봉장 이름 변경</button>
        <button type="button" class="danger" id="toggleDeleteApiaryBtn">봉장 삭제</button>
      </div>

      <div class="collapsible-box" id="addApiaryBox">
        <input type="text" id="newApiaryName" placeholder="새 봉장 이름 (예: 제4봉장)" />
        <label for="newApiaryCount" style="font-size:14px;"><strong>군수:</strong></label>
        <input type="number" id="newApiaryCount" value="20" min="1" max="500" style="width:86px;" />
        <button type="button" id="addApiaryBtn">추가 확정</button>
        <button type="button" class="secondary" id="cancelAddApiaryBtn">취소</button>
      </div>

      <div class="collapsible-box" id="renameApiaryBox">
        <label for="renameApiarySelect" style="font-size:14px;"><strong>대상 봉장:</strong></label>
        <select id="renameApiarySelect"></select>
        <button type="button" id="confirmRenameApiaryBtn">변경 실행</button>
        <button type="button" class="secondary" id="closeRenameApiaryBtn">닫기</button>
      </div>

      <div class="collapsible-box" id="deleteApiaryBox">
        <label for="deleteApiarySelect" style="font-size:14px;"><strong>삭제 봉장:</strong></label>
        <select id="deleteApiarySelect"></select>
        <button type="button" class="danger" id="confirmDeleteApiaryBtn">삭제 실행</button>
        <button type="button" class="secondary" id="closeDeleteApiaryBtn">닫기</button>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">백업 및 복원</div>
      <div class="btn-row">
        <button type="button" class="secondary" id="exportBtn">백업(beekeeper)</button>
        <button type="button" class="secondary" id="importBtn">파일 복원</button>
        <button type="button" class="outline-green" id="togglePasteRestoreBtn">붙여넣기 복원</button>
        <input type="file" id="importFile" class="visually-hidden-file" />
      </div>

      <div class="collapsible-box" id="pasteRestoreBox">
        <textarea id="pasteJsonInput" rows="5" style="width:100%;" placeholder="백업 .json 파일 내용을 여기에 붙여넣으세요"></textarea>
        <button type="button" id="runPasteRestoreBtn">내용으로 복원</button>
        <button type="button" class="secondary" id="clearPasteRestoreBtn">지우기/닫기</button>
      </div>
    </div>
  </section>

  <!-- 2. 봉장 상세 화면: 벌통 카드 / 항목별 통계 -->
  <section id="hiveScreen" class="screen">
    <div class="top-nav">
      <div class="btn-row">
        <button type="button" class="secondary" id="backToApiariesBtn">← 봉장 목록</button>
        <span id="currentApiaryHeading" class="current-apiary-title">제1봉장</span>
      </div>
      <div class="btn-row">
        <button type="button" class="secondary" id="insertHiveBtn">+ 벌통 추가</button>
        <button type="button" class="tab-btn active" id="viewGridBtn">벌통 카드</button>
        <button type="button" class="tab-btn" id="viewStatsBtn">항목별 통계</button>
      </div>
    </div>

    <div class="summary" id="summaryBox"></div>
    <div class="grid" id="hiveGrid"></div>
    <div class="stats-wrap" id="statsWrap" style="display:none;"></div>
  </section>

  <!-- 벌통 내검 모달 -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal">
      <h2 id="modalTitle" style="font-size:18px; margin-bottom:14px;">벌통 내검 기록</h2>
      <div class="field">
        <label>벌통 번호 / 표기</label>
        <input type="text" id="fNum" placeholder="예: 1 또는 1-A" />
      </div>
      <div class="field">
        <label>내검 여부</label>
        <select id="fInspection">
          <option value="불필요">불필요</option>
          <option value="필요">필요</option>
        </select>
      </div>
      <div class="field">
        <label>여왕벌 상태</label>
        <select id="fQueen">
          <option value="정상 산란">정상 산란</option>
          <option value="구왕">구왕</option>
          <option value="신왕">신왕</option>
          <option value="처녀왕">처녀왕</option>
          <option value="왕대 발견">왕대 발견</option>
          <option value="무왕군(주의)">무왕군(주의)</option>
        </select>
      </div>
      <div class="field">
        <label>소비 숫자 (매)</label>
        <input type="number" id="fFrames" min="0" max="30" step="0.5" />
      </div>
      <div class="field">
        <label>착봉 상황</label>
        <select id="fCoverage">
          <option value="양호(밀착)">양호(밀착)</option>
          <option value="보통">보통</option>
          <option value="약군/부족">약군/부족</option>
        </select>
      </div>
      <div class="field">
        <label>산란 상황</label>
        <select id="fBrood">
          <option value="양호(집중 봉판)">양호(집중 봉판)</option>
          <option value="보통">보통</option>
          <option value="산란 부진/없음">산란 부진/없음</option>
        </select>
      </div>
      <div class="field">
        <label>먹이 상황 (저밀·화분·사양)</label>
        <input type="text" id="fFeed" list="feedPresets" placeholder="예: 저밀 충분, 화분떡 공급" />
        <datalist id="feedPresets">
          <option value="저밀 충분"></option>
          <option value="보통"></option>
          <option value="먹이 부족(사양 필요)"></option>
          <option value="화분떡 공급"></option>
        </datalist>
      </div>
      <div class="field">
        <label>질병 및 약제 사용 현황</label>
        <input type="text" id="fTreatment" list="treatmentPresets" placeholder="예: 이상 없음 / 옥살산·플루발리네이트 처리" />
        <datalist id="treatmentPresets">
          <option value="이상 없음"></option>
          <option value="응애 방제 필요"></option>
          <option value="옥살산 처리"></option>
          <option value="플루발리네이트 처리"></option>
          <option value="질병 의심(주의)"></option>
        </datalist>
      </div>
      <div class="field">
        <label>전체 군 상황 및 메모</label>
        <textarea id="fNote" rows="3" placeholder="내검일, 특이사항 기록"></textarea>
      </div>
      <div class="modal-actions">
        <button class="danger" id="deleteHiveBtn">이 벌통 삭제</button>
        <div class="modal-actions-right">
          <button class="secondary" id="closeModalBtn">취소</button>
          <button id="saveHiveBtn">저장</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 집중관리 일자별 기록 모달 -->
  <div class="modal-backdrop" id="focusModalBackdrop">
    <div class="modal" id="focusModalBox">
      <h2 id="focusModalTitle" style="font-size:18px; margin-bottom:10px; color:#5b21b6;">📌 집중관리 기록</h2>

      <div class="field">
        <label>관리 항목 선택</label>
        <div class="type-btn-group" id="focusTypeGroup">
          <button type="button" class="type-choice-btn selected" data-type="처녀왕 이입">처녀왕 이입</button>
          <button type="button" class="type-choice-btn" data-type="왕대 이입">왕대 이입</button>
          <button type="button" class="type-choice-btn" data-type="질병 발생">질병 발생</button>
          <button type="button" class="type-choice-btn" data-type="약제 처치">약제 처치</button>
          <button type="button" class="type-choice-btn" data-type="내검 완료">내검 완료</button>
          <button type="button" class="type-choice-btn" data-type="기타">기타</button>
        </div>
      </div>

      <div class="field">
        <label for="focusDateInput">처치 / 발생 날짜</label>
        <input type="date" id="focusDateInput" />
      </div>

      <div class="field">
        <label for="focusMemoInput">세부 내용 (약제명, 상태, 다음 예정일 등)</label>
        <input type="text" id="focusMemoInput" placeholder="예: 개미산 1차 투입 / 11.10 2차 예정" />
      </div>

      <div class="modal-actions">
        <button type="button" class="danger" id="clearFocusHiveBtn" style="display:none;">집중관리 해제</button>
        <div class="modal-actions-right">
          <button type="button" class="secondary" id="closeFocusModalBtn">닫기</button>
          <button type="button" id="saveFocusRecordBtn" style="background:#6d28d9;">전체 저장</button>
        </div>
      </div>

      <div class="focus-history-box" id="focusAllLogsBox" style="max-height:240px; overflow-y:auto;"></div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'beekeeper_multi_apiary_v1';
    const MAX_BACKUP_FILES = 10;
    const FOCUS_TYPES = ['처녀왕 이입', '왕대 이입', '질병 발생', '약제 처치', '내검 완료', '기타'];

    let state = loadState();
    let currentApiaryId = state.apiaries[0].id;
    let screenMode = 'apiaries';
    let editingHiveIndex = null;
    let focusHiveIndex = null;
    let selectedFocusType = '처녀왕 이입';
    // 각 항목별 임시 메모리 상태: { [type]: { date, memo, dirty, savedId } }
    let focusTempMap = {};
    let viewMode = 'grid';
    let beekeeperDirHandle = null;

    function getTodayISO() {
      const now = new Date();
      const pad = n => String(n).padStart(2, '0');
      return `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
    }

    function formatShortDate(isoDate) {
      if (!isoDate || typeof isoDate !== 'string') return '';
      const parts = isoDate.split('-');
      if (parts.length !== 3) return isoDate;
      return `${Number(parts[1])}/${Number(parts[2])}`;
    }

    function calcElapsedBadge(isoDate) {
      if (!isoDate) return '';
      const parts = isoDate.split('-').map(Number);
      if (parts.length !== 3 || parts.some(Number.isNaN)) return '';
      const target = new Date(parts[0], parts[1] - 1, parts[2]);
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const diffDays = Math.round((today - target) / (1000 * 60 * 60 * 24));
      if (diffDays === 0) return '오늘';
      if (diffDays > 0) return `D+${diffDays}`;
      return `D${diffDays}`;
    }

    function normalizeFocusRecords(rawList) {
      if (!Array.isArray(rawList)) return [];
      return rawList
        .filter(item => item && typeof item === 'object')
        .map((item, idx) => ({
          id: item.id ? String(item.id) : ('f-' + Date.now() + '-' + idx),
          type: item.type ? String(item.type) : '기타',
          date: item.date ? String(item.date) : getTodayISO(),
          memo: item.memo ? String(item.memo) : ''
        }))
        .sort((a, b) => b.date.localeCompare(a.date));
    }

    function createSingleHive(num) {
      return {
        num: String(num),
        inspection: '불필요',
        queen: '정상 산란',
        frames: 6,
        coverage: '양호(밀착)',
        brood: '양호(집중 봉판)',
        feed: '저밀 충분',
        treatment: '이상 없음',
        note: '',
        focusActive: false,
        focusRecords: [],
        updatedAt: ''
      };
    }

    function normalizeHive(h, idx) {
      const base = createSingleHive(idx + 1);
      const src = (h && typeof h === 'object') ? h : {};
      const records = normalizeFocusRecords(src.focusRecords);
      return {
        ...base,
        ...src,
        num: String(src.num !== undefined && src.num !== null && String(src.num).trim() !== '' ? src.num : (idx + 1)),
        inspection: src.inspection === '필요' ? '필요' : '불필요',
        queen: src.queen ? String(src.queen) : '정상 산란',
        frames: (src.frames === '' || src.frames === undefined || src.frames === null || Number.isNaN(Number(src.frames))) ? 0 : Number(src.frames),
        coverage: src.coverage ? String(src.coverage) : '양호(밀착)',
        brood: src.brood ? String(src.brood) : '양호(집중 봉판)',
        feed: src.feed !== undefined && src.feed !== null ? String(src.feed) : '저밀 충분',
        treatment: src.treatment !== undefined && src.treatment !== null ? String(src.treatment) : '이상 없음',
        note: src.note !== undefined && src.note !== null ? String(src.note) : '',
        focusActive: Boolean(src.focusActive || records.length > 0),
        focusRecords: records,
        updatedAt: src.updatedAt ? String(src.updatedAt) : ''
      };
    }

    function normalizeState(rawObj) {
      if (!rawObj || !Array.isArray(rawObj.apiaries) || !rawObj.apiaries.length) {
        return null;
      }
      const apiaries = rawObj.apiaries.map((a, aIdx) => {
        const hivesList = Array.isArray(a && a.hives) ? a.hives : [];
        return {
          id: (a && a.id) ? String(a.id) : ('apiary-' + (aIdx + 1) + '-' + Date.now()),
          name: (a && a.name && String(a.name).trim()) ? String(a.name).trim() : `제${aIdx + 1}봉장`,
          hives: hivesList.map((h, hIdx) => normalizeHive(h, hIdx))
        };
      });
      return { apiaries };
    }

    function createHives(count) {
      return Array.from({ length: count }, (_, i) => createSingleHive(i + 1));
    }

    function renumberHives(apiary) {
      apiary.hives.forEach((h, idx) => {
        h.num = String(idx + 1);
      });
    }

    function loadState() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        try {
          const parsed = JSON.parse(raw);
          const normalized = normalizeState(parsed);
          if (normalized) return normalized;
        } catch (e) {}
      }
      return {
        apiaries: [
          { id: 'apiary-1', name: '제1봉장', hives: createHives(20) }
        ]
      };
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      render();
    }

    function getCurrentApiary() {
      return state.apiaries.find(a => a.id === currentApiaryId) || state.apiaries[0];
    }

    function isDiseaseHive(h) {
      const tr = String(h.treatment || '').trim();
      return Boolean(tr && tr !== '이상 없음');
    }

    function getSpecialCounts(hives) {
      let virgin = 0;
      let queenCell = 0;
      let queenless = 0;
      let disease = 0;

      hives.forEach(h => {
        const q = String(h.queen || '');
        if (q.includes('처녀왕')) virgin += 1;
        if (q.includes('왕대')) queenCell += 1;
        if (q.includes('무왕')) queenless += 1;
        if (isDiseaseHive(h)) disease += 1;
      });

      return { virgin, queenCell, queenless, disease };
    }

    function formatSpecialSummary(counts, compact = false) {
      const items = [
        { label: '처녀왕', count: counts.virgin },
        { label: '왕대', count: counts.queenCell },
        { label: '무왕', count: counts.queenless },
        { label: '질병이상', count: counts.disease }
      ];

      if (compact) {
        const active = items.filter(it => it.count > 0);
        if (!active.length) return '특이사항 없음';
        return active.map(it => `${it.label}: ${it.count}군`).join(' · ');
      }

      return items.map(it => `${it.label}: ${it.count}군`).join(' · ');
    }

    function countAlertHives(apiary) {
      return apiary.hives.filter(h =>
        h.inspection === '필요' ||
        String(h.queen || '').includes('무왕')
      ).length;
    }

    function openApiaryScreen() {
      screenMode = 'apiaries';
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function openHiveScreen(apiaryId) {
      currentApiaryId = apiaryId;
      screenMode = 'hives';
      viewMode = 'grid';
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function toggleHiveInspection(idx, event) {
      if (event) event.stopPropagation();
      const apiary = getCurrentApiary();
      const h = apiary.hives[idx];
      if (!h) return;
      h.inspection = (h.inspection === '필요') ? '불필요' : '필요';
      h.updatedAt = new Date().toISOString();
      saveState();
    }

    function groupByField(hives, selector, barTypeFn) {
      const map = new Map();
      hives.forEach(h => {
        const key = selector(h);
        if (!map.has(key)) map.set(key, []);
        map.get(key).push(h.num + '번');
      });
      return Array.from(map.entries()).map(([label, nums]) => ({
        label,
        count: nums.length,
        percent: hives.length ? Math.round((nums.length / hives.length) * 100) : 0,
        numsText: nums.join(', '),
        barType: barTypeFn ? barTypeFn(label) : ''
      }));
    }

    function renderStats(apiary) {
      const hives = apiary.hives;
      const total = hives.length;

      const focusStats = groupByField(
        hives,
        h => (h.focusActive || (h.focusRecords && h.focusRecords.length > 0)) ? '집중관리 중' : '일반 관리',
        label => label === '집중관리 중' ? 'info' : ''
      );

      const inspectionStats = groupByField(
        hives,
        h => h.inspection || '불필요',
        label => label === '필요' ? 'info' : ''
      );

      const queenStats = groupByField(
        hives,
        h => h.queen || '미기재',
        label => label.includes('무왕') ? 'alert' : (label.includes('왕대') || label === '처녀왕' || label === '구왕') ? 'warn' : ''
      );

      const frameStats = groupByField(
        hives,
        h => `${Number(h.frames || 0)}매`,
        () => ''
      ).sort((a, b) => parseFloat(a.label) - parseFloat(b.label));

      const frameNums = hives.map(h => Number(h.frames || 0));
      const minFrames = frameNums.length ? Math.min(...frameNums) : 0;
      const maxFrames = frameNums.length ? Math.max(...frameNums) : 0;

      const coverageStats = groupByField(
        hives,
        h => h.coverage || '미기재',
        label => label.includes('약군') ? 'warn' : ''
      );

      const broodStats = groupByField(
        hives,
        h => h.brood || '미기재',
        label => label.includes('부진') || label.includes('없음') ? 'warn' : ''
      );

      const feedStats = groupByField(
        hives,
        h => (h.feed && h.feed.trim()) ? h.feed.trim() : '미기재',
        label => label.includes('부족') ? 'alert' : label.includes('공급') ? 'warn' : ''
      );

      const treatmentStats = groupByField(
        hives,
        h => (h.treatment && h.treatment.trim()) ? h.treatment.trim() : '미기재',
        label => (label.includes('질병') || label.includes('의심')) ? 'alert'
               : (label !== '이상 없음' && label !== '미기재') ? 'warn' : ''
      );

      function renderRows(rows) {
        if (!rows.length) return '<div class="hive-list-text">데이터 없음</div>';
        return rows.map(r => `
          <div class="stat-row">
            <div class="stat-row-top">
              <span>${r.label}</span>
              <span>${r.count}군 (${r.percent}% / 전체 ${total}군)</span>
            </div>
            <div class="bar-bg">
              <div class="bar-fill ${r.barType}" style="width:${r.percent}%;"></div>
            </div>
            <div class="hive-list-text">해당 벌통: ${r.numsText}</div>
          </div>
        `).join('');
      }

      document.getElementById('statsWrap').innerHTML = `
        <div class="stats-card">
          <h3>📌 집중관리 현황</h3>
          ${renderRows(focusStats)}
        </div>
        <div class="stats-card">
          <h3>🔎 내검 여부 분포</h3>
          ${renderRows(inspectionStats)}
        </div>
        <div class="stats-card">
          <h3>👑 여왕벌 상태 분포</h3>
          ${renderRows(queenStats)}
        </div>
        <div class="stats-card">
          <h3>🍯 소비 수 분포 (최소 ${minFrames}매 · 최대 ${maxFrames}매)</h3>
          ${renderRows(frameStats)}
        </div>
        <div class="stats-card">
          <h3>🌾 먹이 상황 분포</h3>
          ${renderRows(feedStats)}
        </div>
        <div class="stats-card">
          <h3>🩺 질병 및 약제 사용 현황 분포</h3>
          ${renderRows(treatmentStats)}
        </div>
        <div class="stats-card">
          <h3>🐝 착봉 상황 분포</h3>
          ${renderRows(coverageStats)}
        </div>
        <div class="stats-card">
          <h3>🐣 산란 상황 분포</h3>
          ${renderRows(broodStats)}
        </div>
      `;
    }

    function fillApiarySelect(selectEl) {
      selectEl.innerHTML = '';
      state.apiaries.forEach(a => {
        const opt = document.createElement('option');
        opt.value = a.id;
        opt.textContent = `${a.name} (${a.hives.length}군)`;
        if (a.id === currentApiaryId) opt.selected = true;
        selectEl.appendChild(opt);
      });
    }

    function renderApiaryCards() {
      const listBox = document.getElementById('apiaryListBox');
      listBox.innerHTML = '';

      state.apiaries.forEach(a => {
        const alertCnt = countAlertHives(a);
        const focusCnt = a.hives.filter(h => h.focusActive || (h.focusRecords && h.focusRecords.length > 0)).length;
        const counts = getSpecialCounts(a.hives);
        const hasIssue = (counts.virgin + counts.queenCell + counts.queenless + counts.disease) > 0;
        const subText = formatSpecialSummary(counts, true);

        const card = document.createElement('div');
        card.className = 'apiary-card';
        card.innerHTML = `
          <div class="apiary-card-top">
            <div class="apiary-name">${a.name}</div>
            <div class="apiary-badge">${a.hives.length}군</div>
          </div>
          <div class="apiary-sub ${hasIssue ? 'has-issue' : ''}">${subText}</div>
          ${focusCnt > 0 ? `<div class="apiary-alert-text" style="color:#6d28d9;">집중관리 ${focusCnt}군</div>` : ''}
          ${alertCnt > 0 ? `<div class="apiary-alert-text">점검 ${alertCnt}군</div>` : ''}
        `;
        card.onclick = () => openHiveScreen(a.id);
        listBox.appendChild(card);
      });

      fillApiarySelect(document.getElementById('renameApiarySelect'));
      fillApiarySelect(document.getElementById('deleteApiarySelect'));
    }

    function render() {
      document.getElementById('apiaryScreen').classList.toggle('active', screenMode === 'apiaries');
      document.getElementById('hiveScreen').classList.toggle('active', screenMode === 'hives');

      const allHives = state.apiaries.flatMap(a => a.hives);
      const totalAllHives = allHives.length;
      const allCounts = getSpecialCounts(allHives);
      const totalAllAlertHives = state.apiaries.reduce((sum, a) => sum + countAlertHives(a), 0);
      const hasAnyAllIssue = (allCounts.virgin + allCounts.queenCell + allCounts.queenless + allCounts.disease) > 0;

      document.getElementById('frontSummaryBox').innerHTML = `
        <div class="stat"><span>전체 봉장</span><strong>${totalAllHives}군</strong></div>
        <div class="stat wide-stat"><span>여왕 · 질병 현황</span><strong class="status-detail ${hasAnyAllIssue ? 'warn-text' : ''}">${formatSpecialSummary(allCounts, false)}</strong></div>
        <div class="stat"><span>점검 필요</span><strong>${totalAllAlertHives}군</strong></div>
      `;

      renderApiaryCards();

      const apiary = getCurrentApiary();
      document.getElementById('currentApiaryHeading').textContent = apiary.name;

      document.getElementById('viewGridBtn').classList.toggle('active', viewMode === 'grid');
      document.getElementById('viewStatsBtn').classList.toggle('active', viewMode === 'stats');
      document.getElementById('hiveGrid').style.display = viewMode === 'grid' ? 'grid' : 'none';
      document.getElementById('statsWrap').style.display = viewMode === 'stats' ? 'grid' : 'none';

      const alertCount = countAlertHives(apiary);
      const apiaryCounts = getSpecialCounts(apiary.hives);
      const hasApiaryIssue = (apiaryCounts.virgin + apiaryCounts.queenCell + apiaryCounts.queenless + apiaryCounts.disease) > 0;

      document.getElementById('summaryBox').innerHTML = `
        <div class="stat"><span>현재 봉장</span><strong>${apiary.hives.length}군</strong></div>
        <div class="stat wide-stat"><span>여왕 · 질병 현황</span><strong class="status-detail ${hasApiaryIssue ? 'warn-text' : ''}">${formatSpecialSummary(apiaryCounts, false)}</strong></div>
        <div class="stat"><span>점검 필요</span><strong>${alertCount}군</strong></div>
      `;

      const grid = document.getElementById('hiveGrid');
      grid.innerHTML = '';
      apiary.hives.forEach((h, idx) => {
        const card = document.createElement('div');
        const isInspectNeeded = h.inspection === '필요';
        const records = Array.isArray(h.focusRecords) ? h.focusRecords : [];
        const isFocusActive = Boolean(h.focusActive || records.length > 0);
        const latestFocus = records.length > 0 ? records[0] : null;

        const queenText = String(h.queen || '');
        const coverageText = String(h.coverage || '');
        const feedText = String(h.feed || '');
        const treatmentText = String(h.treatment || '');
        const noteText = String(h.note || '').trim();

        let cls = 'hive-card';
        if (queenText.includes('무왕') || treatmentText.includes('질병') || treatmentText.includes('의심')) cls += ' alert';
        else if (queenText.includes('왕대') || queenText.includes('처녀왕') || coverageText.includes('약군') || feedText.includes('부족') || isDiseaseHive(h)) cls += ' caution';
        else if (isInspectNeeded) cls += ' inspect-needed';
        else if (isFocusActive) cls += ' focus-active';
        card.className = cls;

        let focusBannerHtml = '';
        if (latestFocus) {
          const shortDate = formatShortDate(latestFocus.date);
          const dday = calcElapsedBadge(latestFocus.date);
          const extraCount = records.length > 1 ? ` 외 ${records.length - 1}건` : '';
          focusBannerHtml = `
            <div class="focus-banner">
              <div class="focus-banner-top">
                <span>📌 ${shortDate} ${latestFocus.type}${extraCount}</span>
                ${dday ? `<span class="focus-dday">${dday}</span>` : ''}
              </div>
              ${latestFocus.memo ? `<div class="focus-banner-note">${latestFocus.memo}</div>` : ''}
            </div>
          `;
        } else if (isFocusActive) {
          focusBannerHtml = `
            <div class="focus-banner">
              <div class="focus-banner-top"><span>📌 집중관리 대상</span></div>
            </div>
          `;
        }

        card.innerHTML = `
          <div class="hive-header">
            <div class="hive-num">${h.num}번</div>
            <div class="header-controls">
              <button
                type="button"
                class="focus-chip ${isFocusActive ? 'is-active' : ''}"
                aria-label="${h.num}번 벌통 집중관리 기록"
              >집중관리</button>
              <div class="inspect-control">
                <span class="inspect-label">내검</span>
                <span
                  role="button"
                  tabindex="0"
                  class="inspect-toggle ${isInspectNeeded ? 'is-active' : ''}"
                  aria-label="${h.num}번 벌통 내검대상 전환"
                  aria-pressed="${isInspectNeeded ? 'true' : 'false'}"
                  data-hive-idx="${idx}"
                >
                  <span class="inspect-dot left"></span>
                  <span class="inspect-dot right"></span>
                </span>
              </div>
            </div>
          </div>
          ${focusBannerHtml}
          <div class="hive-lines">
            <div class="hive-line"><span class="hive-line-key">여왕</span><span class="hive-line-val">${h.queen}</span></div>
            <div class="hive-line"><span class="hive-line-key">소비</span><span class="hive-line-val">${h.frames}매</span></div>
            <div class="hive-line"><span class="hive-line-key">착봉</span><span class="hive-line-val">${h.coverage}</span></div>
            <div class="hive-line"><span class="hive-line-key">산란</span><span class="hive-line-val">${h.brood}</span></div>
            <div class="hive-line"><span class="hive-line-key">먹이</span><span class="hive-line-val">${h.feed}</span></div>
            <div class="hive-line"><span class="hive-line-key">약제/병</span><span class="hive-line-val">${h.treatment}</span></div>
            ${noteText ? `<div class="hive-note-box">${noteText}</div>` : ''}
          </div>
        `;

        const focusBtn = card.querySelector('.focus-chip');
        focusBtn.onclick = (ev) => {
          ev.stopPropagation();
          openFocusModal(idx);
        };

        const toggleBtn = card.querySelector('.inspect-toggle');
        toggleBtn.onclick = (ev) => toggleHiveInspection(idx, ev);
        toggleBtn.onkeydown = (ev) => {
          if (ev.key === 'Enter' || ev.key === ' ') {
            ev.preventDefault();
            toggleHiveInspection(idx, ev);
          }
        };

        card.onclick = () => openModal(idx);
        grid.appendChild(card);
      });

      renderStats(apiary);
    }

    function openFocusModal(idx) {
      focusHiveIndex = idx;
      const apiary = getCurrentApiary();
      const h = apiary.hives[idx];
      if (!h) return;

      document.getElementById('focusModalTitle').textContent = `📌 ${apiary.name} - ${h.num}번 집중관리`;
      const records = Array.isArray(h.focusRecords) ? h.focusRecords : [];
      selectedFocusType = (records.length > 0 && FOCUS_TYPES.includes(records[0].type))
        ? records[0].type
        : FOCUS_TYPES[0];

      document.querySelectorAll('#focusTypeGroup .type-choice-btn').forEach(btn => {
        btn.classList.toggle('selected', btn.dataset.type === selectedFocusType);
      });

      const latestForType = records.find(r => r.type === selectedFocusType);
      document.getElementById('focusDateInput').value = (latestForType && latestForType.date) ? latestForType.date : getTodayISO();
      document.getElementById('focusMemoInput').value = '';

      renderFocusTimeline(h);
      document.getElementById('focusModalBackdrop').style.display = 'flex';
    }

    function renderFocusTimeline(h, scrollToTimeline = false) {
      const records = Array.isArray(h.focusRecords) ? h.focusRecords : [];
      const clearBtn = document.getElementById('clearFocusHiveBtn');
      clearBtn.style.display = (h.focusActive || records.length > 0) ? 'inline-block' : 'none';

      const allBox = document.getElementById('focusAllLogsBox');
      if (!records.length) {
        allBox.innerHTML = '<div class="hive-list-text">저장된 누적 처지내용이 아직 없습니다.</div>';
        return;
      }

      allBox.innerHTML = `
        <div class="focus-history-title">누적 처지내용 타임라인 (${records.length}건)</div>
        ${records.map((rec, rIdx) => {
          const dday = calcElapsedBadge(rec.date);
          return `
            <div class="focus-cum-item">
              <div class="focus-cum-top">
                <span>${rec.date} (${dday}) · ${rec.type}</span>
                <button type="button" class="focus-log-del" data-rec-idx="${rIdx}">기록삭제</button>
              </div>
              <div class="focus-cum-body">${rec.memo || '(메모 없음)'}</div>
            </div>
          `;
        }).join('')}
      `;

      allBox.querySelectorAll('.focus-log-del').forEach(btn => {
        btn.onclick = () => {
          const rIdx = Number(btn.dataset.recIdx);
          h.focusRecords.splice(rIdx, 1);
          if (h.focusRecords.length === 0) {
            h.focusActive = false;
          }
          h.updatedAt = new Date().toISOString();
          renderFocusTimeline(h, true);
          saveState();
        };
      });

      if (scrollToTimeline) {
        allBox.scrollTop = 0;
        allBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    document.querySelectorAll('#focusTypeGroup .type-choice-btn').forEach(btn => {
      btn.onclick = () => {
        selectedFocusType = btn.dataset.type;
        document.querySelectorAll('#focusTypeGroup .type-choice-btn').forEach(b => {
          b.classList.toggle('selected', b.dataset.type === selectedFocusType);
        });
        const apiary = getCurrentApiary();
        const h = apiary.hives[focusHiveIndex];
        const records = (h && Array.isArray(h.focusRecords)) ? h.focusRecords : [];
        const latestForType = records.find(r => r.type === selectedFocusType);
        document.getElementById('focusDateInput').value = (latestForType && latestForType.date) ? latestForType.date : getTodayISO();
      };
    });

    document.getElementById('closeFocusModalBtn').onclick = () => {
      document.getElementById('focusModalBackdrop').style.display = 'none';
    };

    document.getElementById('saveFocusRecordBtn').onclick = () => {
      const apiary = getCurrentApiary();
      const h = apiary.hives[focusHiveIndex];
      if (!h) return;

      const dateVal = document.getElementById('focusDateInput').value || getTodayISO();
      const memoVal = document.getElementById('focusMemoInput').value.trim();

      if (!Array.isArray(h.focusRecords)) h.focusRecords = [];
      h.focusRecords.push({
        id: 'f-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6),
        type: selectedFocusType,
        date: dateVal,
        memo: memoVal
      });
      h.focusRecords.sort((a, b) => b.date.localeCompare(a.date));
      h.focusActive = true;
      h.updatedAt = new Date().toISOString();

      document.getElementById('focusMemoInput').value = '';
      saveState();
      renderFocusTimeline(h, true);
    };

    document.getElementById('clearFocusHiveBtn').onclick = () => {
      const apiary = getCurrentApiary();
      const h = apiary.hives[focusHiveIndex];
      if (!h) return;

      if (confirm(`${h.num}번 벌통의 집중관리 표시와 누적 기록을 모두 지우고 해제할까요?`)) {
        h.focusRecords = [];
        h.focusActive = false;
        h.updatedAt = new Date().toISOString();
        document.getElementById('focusModalBackdrop').style.display = 'none';
        saveState();
      }
    };

    function openSingleBox(targetId) {
      ['addApiaryBox', 'renameApiaryBox', 'deleteApiaryBox', 'pasteRestoreBox'].forEach(id => {
        const el = document.getElementById(id);
        if (id === targetId) el.classList.toggle('open');
        else el.classList.remove('open');
      });
    }

    document.getElementById('backToApiariesBtn').onclick = openApiaryScreen;

    document.getElementById('toggleAddApiaryBtn').onclick = () => {
      openSingleBox('addApiaryBox');
      if (document.getElementById('addApiaryBox').classList.contains('open')) {
        document.getElementById('newApiaryName').focus();
      }
    };

    document.getElementById('cancelAddApiaryBtn').onclick = () => {
      document.getElementById('addApiaryBox').classList.remove('open');
    };

    document.getElementById('toggleRenameApiaryBtn').onclick = () => {
      openSingleBox('renameApiaryBox');
    };

    document.getElementById('closeRenameApiaryBtn').onclick = () => {
      document.getElementById('renameApiaryBox').classList.remove('open');
    };

    document.getElementById('toggleDeleteApiaryBtn').onclick = () => {
      openSingleBox('deleteApiaryBox');
    };

    document.getElementById('closeDeleteApiaryBtn').onclick = () => {
      document.getElementById('deleteApiaryBox').classList.remove('open');
    };

    document.getElementById('confirmRenameApiaryBtn').onclick = () => {
      const targetId = document.getElementById('renameApiarySelect').value;
      const apiary = state.apiaries.find(a => a.id === targetId) || getCurrentApiary();
      const nextName = prompt('새 봉장 이름을 입력하세요.', apiary.name);
      if (nextName === null) return;
      const trimmed = nextName.trim();
      if (!trimmed) {
        alert('봉장 이름을 비워 둘 수 없습니다.');
        return;
      }
      apiary.name = trimmed;
      saveState();
    };

    document.getElementById('confirmDeleteApiaryBtn').onclick = () => {
      if (state.apiaries.length <= 1) {
        alert('최소 1개의 봉장은 남아 있어야 합니다.');
        return;
      }
      const targetId = document.getElementById('deleteApiarySelect').value;
      const apiary = state.apiaries.find(a => a.id === targetId) || getCurrentApiary();
      if (confirm(`'${apiary.name}' 전체 기록을 삭제할까요?`)) {
        state.apiaries = state.apiaries.filter(a => a.id !== apiary.id);
        currentApiaryId = state.apiaries[0].id;
        saveState();
      }
    };

    async function ensureBeekeeperFolder() {
      if (!window.showDirectoryPicker) return null;

      if (beekeeperDirHandle) {
        try {
          const perm = await beekeeperDirHandle.queryPermission({ mode: 'readwrite' });
          if (perm === 'granted') {
            for await (const _ of beekeeperDirHandle.entries()) {
              break;
            }
            return beekeeperDirHandle;
          }
          const req = await beekeeperDirHandle.requestPermission({ mode: 'readwrite' });
          if (req === 'granted') return beekeeperDirHandle;
        } catch (err) {
          beekeeperDirHandle = null;
        }
      }

      const rootHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
      if (rootHandle.name.toLowerCase() === 'beekeeper') {
        beekeeperDirHandle = rootHandle;
      } else {
        beekeeperDirHandle = await rootHandle.getDirectoryHandle('beekeeper', { create: true });
      }
      document.getElementById('syncStatus').textContent = '로컬 저장 모드 · 폴더: beekeeper 연결됨 (최근 10개 유지)';
      return beekeeperDirHandle;
    }

    async function pruneOldBackups(dirHandle, keepCount = MAX_BACKUP_FILES) {
      if (!dirHandle || typeof dirHandle.entries !== 'function') return 0;
      const backupFiles = [];

      for await (const [name, handle] of dirHandle.entries()) {
        if (
          handle &&
          handle.kind === 'file' &&
          name.startsWith('apiary-backup-') &&
          name.endsWith('.json')
        ) {
          backupFiles.push(name);
        }
      }

      backupFiles.sort((a, b) => b.localeCompare(a));

      const toDelete = backupFiles.slice(keepCount);
      let deletedCount = 0;

      for (const oldName of toDelete) {
        try {
          await dirHandle.removeEntry(oldName);
          deletedCount += 1;
        } catch (err) {}
      }
      return deletedCount;
    }

    function makeBackupFilename() {
      const now = new Date();
      const pad = n => String(n).padStart(2, '0');
      const stamp = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;
      return `apiary-backup-${stamp}.json`;
    }

    function applyRestoredData(parsed, labelText) {
      const normalized = normalizeState(parsed);
      if (!normalized) {
        alert('올바른 백업 파일이 아닙니다. (apiaries 배열 확인 필요)');
        return false;
      }
      state = normalized;
      currentApiaryId = state.apiaries[0].id;
      screenMode = 'apiaries';
      saveState();
      alert(`${labelText || '백업 데이터'}에서 복원했습니다.`);
      return true;
    }

    function readViaFileReader(file, asArrayBuffer) {
      return new Promise((resolve, reject) => {
        if (typeof FileReader === 'undefined') {
          reject(new Error('FileReader 미지원'));
          return;
        }
        const reader = new FileReader();
        reader.onload = () => {
          if (asArrayBuffer && reader.result instanceof ArrayBuffer) {
            resolve(new TextDecoder('utf-8').decode(reader.result));
          } else {
            resolve(String(reader.result || ''));
          }
        };
        reader.onerror = () => reject(reader.error || new Error('FileReader 오류'));
        if (asArrayBuffer && typeof reader.readAsArrayBuffer === 'function') {
          reader.readAsArrayBuffer(file);
        } else {
          reader.readAsText(file, 'utf-8');
        }
      });
    }

    async function readBackupFileText(file) {
      const attempts = [
        () => (typeof file.text === 'function' ? file.text() : Promise.reject(new Error('file.text 미지원'))),
        () => readViaFileReader(file, false),
        () => readViaFileReader(file, true)
      ];
      let lastErr = null;
      for (const fn of attempts) {
        try {
          const text = await fn();
          if (typeof text === 'string' && text.replace(/^﻿/, '').trim().length > 0) {
            return text;
          }
        } catch (err) {
          lastErr = err;
        }
      }
      throw lastErr || new Error('파일 내용을 읽을 수 없습니다.');
    }

    document.getElementById('exportBtn').onclick = async () => {
      const filename = makeBackupFilename();
      const jsonText = JSON.stringify(state, null, 2);

      try {
        const dirHandle = await ensureBeekeeperFolder();
        if (dirHandle) {
          const fileHandle = await dirHandle.getFileHandle(filename, { create: true });
          const writable = await fileHandle.createWritable();
          await writable.write(jsonText);
          await writable.close();

          const deletedCount = await pruneOldBackups(dirHandle, MAX_BACKUP_FILES);
          const extraMsg = deletedCount > 0 ? `
오래된 백업 ${deletedCount}개를 자동 정리해 최근 ${MAX_BACKUP_FILES}개만 남겼습니다.` : '';
          alert(`beekeeper 폴더에 '${filename}' 파일로 저장했습니다.${extraMsg}`);
          return;
        }
      } catch (err) {
        if (err && err.name === 'AbortError') return;
      }

      const blob = new Blob([jsonText], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
      alert(`'${filename}' 파일을 내려받았습니다.`);
    };

    const importFileInput = document.getElementById('importFile');
    document.getElementById('importBtn').onclick = () => {
      importFileInput.value = '';
      importFileInput.click();
    };

    importFileInput.onchange = async (e) => {
      const file = e.target.files && e.target.files[0];
      const fileName = file && file.name ? file.name : '선택한 파일';
      e.target.value = '';
      if (!file) return;

      try {
        const rawText = await readBackupFileText(file);
        const cleaned = String(rawText || '').replace(/^﻿/, '').trim();
        const parsed = JSON.parse(cleaned);
        applyRestoredData(parsed, fileName);
      } catch (err) {
        document.getElementById('pasteRestoreBox').classList.add('open');
        document.getElementById('pasteJsonInput').focus();
        alert(
          `[${fileName}] 파일 읽기/복원 실패
` +
          `원인: ${err && err.message ? err.message : String(err)}

` +
          `아래 '붙여넣기 복원' 창에 JSON 내용을 붙여넣어 복원해 주세요.`
        );
      }
    };

    document.getElementById('togglePasteRestoreBtn').onclick = () => {
      openSingleBox('pasteRestoreBox');
      if (document.getElementById('pasteRestoreBox').classList.contains('open')) {
        document.getElementById('pasteJsonInput').focus();
      }
    };

    document.getElementById('clearPasteRestoreBtn').onclick = () => {
      document.getElementById('pasteJsonInput').value = '';
      document.getElementById('pasteRestoreBox').classList.remove('open');
    };

    document.getElementById('runPasteRestoreBtn').onclick = () => {
      const raw = document.getElementById('pasteJsonInput').value.replace(/^﻿/, '').trim();
      if (!raw) {
        alert('붙여넣은 JSON 내용이 없습니다.');
        return;
      }
      try {
        const parsed = JSON.parse(raw);
        const ok = applyRestoredData(parsed, '붙여넣기 데이터');
        if (ok) {
          document.getElementById('pasteJsonInput').value = '';
          document.getElementById('pasteRestoreBox').classList.remove('open');
        }
      } catch (err) {
        alert('JSON 형식 오류: ' + (err && err.message ? err.message : String(err)));
      }
    };

    document.getElementById('viewGridBtn').onclick = () => {
      viewMode = 'grid';
      render();
    };

    document.getElementById('viewStatsBtn').onclick = () => {
      viewMode = 'stats';
      render();
    };

    document.getElementById('insertHiveBtn').onclick = () => {
      const apiary = getCurrentApiary();
      const maxPos = apiary.hives.length + 1;
      const answer = prompt(
        `몇 번 위치에 새 벌통을 넣을까요? (1 ~ ${maxPos} 입력)
※ ${maxPos}을 입력하거나 그대로 확인을 누르면 맨 뒤에 추가됩니다.`,
        String(maxPos)
      );
      if (answer === null) return;

      const pos = Number(answer.trim());
      if (!Number.isInteger(pos) || pos < 1 || pos > maxPos) {
        alert(`1부터 ${maxPos} 사이의 번호를 입력해 주세요.`);
        return;
      }

      apiary.hives.splice(pos - 1, 0, createSingleHive(pos));
      renumberHives(apiary);
      saveState();
    };

    function openModal(idx) {
      editingHiveIndex = idx;
      const h = getCurrentApiary().hives[idx];
      document.getElementById('modalTitle').textContent = `${getCurrentApiary().name} - ${h.num}번 벌통 기록`;
      document.getElementById('fNum').value = h.num;
      document.getElementById('fInspection').value = h.inspection || '불필요';
      document.getElementById('fQueen').value = h.queen;
      document.getElementById('fFrames').value = h.frames;
      document.getElementById('fCoverage').value = h.coverage;
      document.getElementById('fBrood').value = h.brood;
      document.getElementById('fFeed').value = h.feed;
      document.getElementById('fTreatment').value = h.treatment;
      document.getElementById('fNote').value = h.note;
      document.getElementById('modalBackdrop').style.display = 'flex';
    }

    document.getElementById('closeModalBtn').onclick = () => {
      document.getElementById('modalBackdrop').style.display = 'none';
    };

    document.getElementById('saveHiveBtn').onclick = () => {
      const h = getCurrentApiary().hives[editingHiveIndex];
      h.num = document.getElementById('fNum').value.trim() || h.num;
      h.inspection = document.getElementById('fInspection').value;
      h.queen = document.getElementById('fQueen').value;
      h.frames = document.getElementById('fFrames').value;
      h.coverage = document.getElementById('fCoverage').value;
      h.brood = document.getElementById('fBrood').value;
      h.feed = document.getElementById('fFeed').value;
      h.treatment = document.getElementById('fTreatment').value;
      h.note = document.getElementById('fNote').value;
      h.updatedAt = new Date().toISOString();
      document.getElementById('modalBackdrop').style.display = 'none';
      saveState();
    };

    document.getElementById('deleteHiveBtn').onclick = () => {
      const apiary = getCurrentApiary();
      if (apiary.hives.length <= 1) {
        alert('최소 1군은 남아 있어야 합니다.');
        return;
      }
      const targetHive = apiary.hives[editingHiveIndex];
      if (confirm(`${targetHive.num}번 벌통을 삭제하고 뒷번호를 앞으로 당길까요?`)) {
        apiary.hives.splice(editingHiveIndex, 1);
        renumberHives(apiary);
        document.getElementById('modalBackdrop').style.display = 'none';
        saveState();
      }
    };

    document.getElementById('addApiaryBtn').onclick = () => {
      const nameInput = document.getElementById('newApiaryName');
      const countInput = document.getElementById('newApiaryCount');
      const name = nameInput.value.trim() || `제${state.apiaries.length + 1}봉장`;
      const count = Math.max(1, Math.min(500, Number(countInput.value) || 20));
      const newId = 'apiary-' + Date.now();
      state.apiaries.push({ id: newId, name, hives: createHives(count) });
      currentApiaryId = newId;
      nameInput.value = '';
      document.getElementById('addApiaryBox').classList.remove('open');
      saveState();
    };

    render();
  </script>
</body>
