<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <title>🌳 고급 일본어 학습</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "맑은 고딕", sans-serif; 
      padding: 16px; 
      line-height: 1.6; 
      max-width: 700px; 
      margin: 0 auto; 
      background-color: #f4f6f8;
    }
    
    /* 상단 네비게이션 & 고정 바 */
    .nav-bar {
      position: sticky; 
      top: 0; 
      background: rgba(255, 255, 255, 0.98); 
      padding: 10px 12px;
      border-bottom: 3px solid #0d47a1; 
      margin-bottom: 20px; 
      z-index: 10;
      display: flex; 
      align-items: center; 
      justify-content: space-between;
      gap: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.06); 
      border-radius: 12px;
    }

    .nav-btn {
      padding: 8px 12px;
      text-align: center;
      font-size: 15px;
      font-weight: bold;
      text-decoration: none;
      color: #111111;
      background-color: #ffffff;
      border: 1.5px solid #bbb;
      border-radius: 8px;
      white-space: nowrap;
      flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
    }
    .nav-btn.direct {
      background-color: #1b5e20;
      color: #ffffff;
      border: none;
    }
    .nav-btn:active { opacity: 0.8; }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .progress-text { 
      font-weight: bold; 
      color: #0d47a1; 
      font-size: 14px; 
      white-space: nowrap;
    }

    .jump-btn {
      background-color: #1565c0; 
      color: white; 
      border: none;
      padding: 8px 12px; 
      border-radius: 8px; 
      cursor: pointer; 
      font-weight: bold; 
      font-size: 14px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .jump-btn:active { opacity: 0.85; }
    
    /* 섹션 제목 스타일 */
    .section-header {
      font-size: 22px;
      color: #0d47a1;
      margin: 16px 0 14px 0;
      padding: 10px 14px;
      background-color: #e8eaf6;
      border-left: 6px solid #0d47a1;
      border-radius: 8px;
      font-weight: 800;
    }

    /* 학습 카드 스타일 */
    .item { 
      display: flex; align-items: flex-start; justify-content: space-between;
      padding: 18px; margin-bottom: 14px; background: white; 
      border: 1px solid #e2e8f0; border-radius: 14px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04); gap: 14px;
      transition: opacity 0.2s ease;
    }
    .item-content { flex: 1; display: flex; flex-direction: column; gap: 8px; word-break: break-word; }

    /* 글자 크기 및 두께 스타일 */
    .jp-text { font-size: 22px; font-weight: bold; color: #111111; }
    .reading-text { font-size: 18px; font-weight: bold; color: #1b5e20; }
    .ko-text { font-size: 19px; font-weight: bold; color: #222222; margin-top: 2px; }

    /* 확인 완료 시 흐려지는 효과 (투명도 적용) */
    .item.completed .jp-text, 
    .item.completed .reading-text, 
    .item.completed .ko-text { 
      opacity: 0.35; 
    }
    
    /* 버튼 그룹 컨테이너 */
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
    }

    .btn {
      background-color: #0d47a1; color: white; border: none;
      padding: 10px 14px; border-radius: 8px; cursor: pointer; font-weight: bold;
      font-size: 15px; text-align: center;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active { background-color: #0a3880; }

    /* 확인 버튼 스타일 */
    .check-btn {
      background-color: #e2e8f0;
      color: #475569;
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .check-btn:active {
      transform: scale(0.96);
    }
    .item.completed .check-btn {
      background-color: #16a34a;
      color: #ffffff;
    }

    /* 페이지네이션 버튼 */
    .pagination {
      display: flex; justify-content: center; align-items: center;
      gap: 8px; margin-top: 25px; margin-bottom: 30px; flex-wrap: wrap;
    }
    .page-btn {
      background: white; border: 1px solid #cbd5e1; padding: 10px 16px;
      border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px;
    }
    .page-btn.active { background-color: #0d47a1; color: white; border-color: #0d47a1; }
    .page-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  </style>
</head>

          var midH2 = document.createElement('h2');
          midH2.className = 'section-header';
          midH2.style.whiteSpace = 'pre-line';
          midH2.innerText = item.sectionTitle;
          listDiv.appendChild(midH2);
        }

        var div = document.createElement('div');
        div.className = 'item' + (isChecked ? ' completed' : '');
        
        div.innerHTML = 
          '<div class="item-content">' +
            '<div class="jp-text">' + item.num + '. ' + item.kanji + '</div>' +
            '<div class="reading-text">📖 ' + item.kana + '</div>' +
            '<div class="ko-text">💡 ' + item.kr + '</div>' +
          '</div>' +
          '<div class="btn-group">' +
            '<button class="btn sound-btn" data-file="' + item.audio + '">🔊 소리</button>' +
            '<button class="check-btn" data-index="' + realIndex + '">' + (isChecked ? '✓ 완료' : '확인') + '</button>' +
          '</div>';

        listDiv.appendChild(div);
      });

      var percent = Math.round((completedCount / data.length) * 100) || 0;
      progressText.innerText = '고급-학습: ' + completedCount + ' / ' + data.length + ' (' + percent + '%)';

      renderPagination();
    }

    function renderPagination() {
      paginationDiv.innerHTML = '';
      var totalPages = Math.ceil(data.length / PAGE_SIZE);

      if (totalPages <= 1) return;

      var prevBtn = document.createElement('button');
      prevBtn.className = 'page-btn';
      prevBtn.innerText = '이전';
      prevBtn.disabled = (currentPage === 1);
      prevBtn.onclick = function() { currentPage--; render(); window.scrollTo(0, 0); };
      paginationDiv.appendChild(prevBtn);

      for (var p = 1; p <= totalPages; p++) {
        (function(pageNum) {
          var btn = document.createElement('button');
          btn.className = 'page-btn' + (pageNum === currentPage ? ' active' : '');
          btn.innerText = pageNum;
          btn.onclick = function() {
            currentPage = pageNum;
            render();
            window.scrollTo(0, 0);
          };
          paginationDiv.appendChild(btn);
        })(p);
      }

      var nextBtn = document.createElement('button');
      nextBtn.className = 'page-btn';
      nextBtn.innerText = '다음';
      nextBtn.disabled = (currentPage === totalPages);
      nextBtn.onclick = function() { currentPage++; render(); window.scrollTo(0, 0); };
      paginationDiv.appendChild(nextBtn);
    }

    document.addEventListener('click', function(e) {
      // 오디오 재생 버튼 클릭 시
      if (e.target && e.target.classList.contains('sound-btn')) {
        var rawFile = e.target.getAttribute('data-file');
        var cleanFile = String(rawFile).replace(/[\u200B-\u200D\uFEFF\u00A0]/g, '').trim();

        player.pause();
        player.src = './audio/' + cleanFile;
        player.load();
        
        var playPromise = player.play();
        if (playPromise !== undefined) {
          playPromise.catch(function(err) {
            alert('오디오를 재생할 수 없습니다. audio 폴더에 ' + cleanFile + ' 파일이 있는지 확인해 주세요.');
          });
        }
      }

      // 확인 버튼 클릭 시 (토글 및 저장)
      if (e.target && e.target.classList.contains('check-btn')) {
        var idx = e.target.getAttribute('data-index');
        savedProgress[idx] = !savedProgress[idx];
        localStorage.setItem('my_study_progress_advanced', JSON.stringify(savedProgress));
        render();
      }
    });

    document.getElementById('jumpBtn').onclick = function() {
      var targetIndex = -1;
      for (var i = 0; i < data.length; i++) {
        if (!savedProgress[i]) {
          targetIndex = i;
          break;
        }
      }

      (targetIndex !== -1) ? (currentPage = Math.floor(targetIndex / PAGE_SIZE) + 1, render(), window.scrollTo(0, 0)) : alert('🎉 고급 과정의 모든 문장 공부를 완료하셨습니다!');
    };

    render();
  </script>

</body>
</html>
