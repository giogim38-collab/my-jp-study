<!DOCTYPE html>

<head>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "맑은 고딕", sans-serif; 
      padding: 16px; 
      line-height: 1.6; 
      max-width: 700px; 
      margin: 0 auto; 
      background-color: #f4f6f8;
    }
    
    /* 상단 네비게이션 바 */
    .nav-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }
    .nav-btn {
      flex: 1;
      padding: 14px 10px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      text-decoration: none;
      color: #111111;
      background-color: #ffffff;
      border: 2px solid #bbb;
      border-radius: 12px;
      -webkit-tap-highlight-color: transparent;
    }
    .nav-btn.direct {
      background-color: #1b5e20;
      color: #ffffff;
      border: none;
    }
    .nav-btn:active { opacity: 0.8; }

    /* 상단 고정 진행률 바 */
    .progress-box {
      position: sticky; top: 0; background: rgba(255, 255, 255, 0.98); padding: 14px 12px;
      border-bottom: 3px solid #0d47a1; margin-bottom: 20px; z-index: 10;
      display: flex; justify-content: space-between; align-items: center;
      box-shadow: 0 4px 8px rgba(0,0,0,0.06); border-radius: 12px;
    }
    .progress-text { font-weight: bold; color: #0d47a1; font-size: 18px; }
    .jump-btn {
      background-color: #1565c0; color: white; border: none;
      padding: 10px 14px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px;
    }
    .jump-btn:active { opacity: 0.85; }
    
    /* 섹션 제목 스타일 */
    .section-header {
      font-size: 22px;
      color: #0d47a1;
      margin: 16px 0 14px 0;
      padding: 10px 14px;
      background-color: #e8eaf6;
      border-left: 6px solid #0d47a1;
      border-radius: 8px;
      font-weight: 800;
    }

    /* 학습 카드 스타일 */
    .item { 
      display: flex; align-items: flex-start; justify-content: space-between;
      padding: 18px; margin-bottom: 14px; background: white; 
      border: 1px solid #e2e8f0; border-radius: 14px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04); gap: 14px;
      transition: opacity 0.2s ease;
    }
    .item-check { padding-top: 4px; }
    input[type="checkbox"] { width: 26px; height: 26px; cursor: pointer; accent-color: #0d47a1; }
    .item-content { flex: 1; display: flex; flex-direction: column; gap: 8px; word-break: break-word; }

    /* 글자 크기 및 두께 스타일 */
    .jp-text { font-size: 22px; font-weight: bold; color: #111111; }
    .reading-text { font-size: 18px; font-weight: bold; color: #1b5e20; }
    .ko-text { font-size: 19px; font-weight: bold; color: #222222; margin-top: 2px; }

    /* 체크 완료 시 흐려지는 효과 (취소선 대신 투명도 적용) */
    .item.completed .jp-text, 
    .item.completed .reading-text, 
    .item.completed .ko-text { 
      opacity: 0.35; 
    }
    
    .btn {
      background-color: #0d47a1; color: white; border: none;
      padding: 12px 16px; border-radius: 8px; cursor: pointer; font-weight: bold;
      flex-shrink: 0; font-size: 16px;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active { background-color: #0a3880; }

    /* 페이지네이션 버튼 */
    .pagination {
      display: flex; justify-content: center; align-items: center;
      gap: 8px; margin-top: 25px; margin-bottom: 30px; flex-wrap: wrap;
    }
    .page-btn {
      background: white; border: 1px solid #cbd5e1; padding: 10px 16px;
      border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px;
    }
    .page-btn.active { background-color: #0d47a1; color: white; border-color: #0d47a1; }
    .page-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  </style>

        kr: "투병 중에는 많은 분이 걱정하며 전화를 주셨는데, 저는 목소리만큼은 항상 활기차서 다들 「건강해 보이셔서 안심했습니다」라고 말씀해 주시는 것입니다.",

      {

      },
      {
        num: 37,
        kanji: "それでも、今も一日に何回も「九十四歳」って口に出さないと、自分の年齢が信じられない。",
        kana: "それでも、いまもいちにちになんかいも「きゅうじゅうよんさい」ってくちにださないと、じぶんのねんれいがしんじられない。",
        kr: "그럼에도, 지금도 하루에 몇 번씩이나 「94세」라고 입 밖에 내지 않으면 제 나이가 믿기지 않습니다.",

      },
      {

        kanji: "人に年を聞かれて、つい「七十四歳」なんて口にする。",

        kr: "남이 나이를 물어보면, 나도 모르게 「74세」라고 말하곤 합니다.",

      },
      {
        num: 39,
        kanji: "ひ孫のように若いスタッフはそのたび、「そういうのを天然ボケと言うんですよ」などと平然と言います。",
        kana: "ひまごのようにわかいスタッフはそのたび、「そういうのをてんねんボケというんですよ」などとへいぜんといいます。",
        kr: "증손주처럼 어린 스태프는 그때마다 「그런 걸 자연스러운 엉뚱함(천연 보케)이라고 하는 거예요」라고 태연하게 말합니다.",
        audio: "seto_39.mp3"
      }
    ];

    var PAGE_SIZE = 5;
    var currentPage = 1;
    var listDiv = document.getElementById('list');
    var progressText = document.getElementById('progressText');
    var paginationDiv = document.getElementById('pagination');
    var player = document.getElementById('player');

    var savedProgress = JSON.parse(localStorage.getItem('my_study_progress_advanced') || '{}');

    // 특정 인덱스 이전까지의 최신 섹션 타이틀을 찾는 함수
    function findCurrentSectionTitle(targetIdx) {
      for (var i = targetIdx; i >= 0; i--) {
        if (data[i] && data[i].sectionTitle) {
          return data[i].sectionTitle;
        }
      }
      return null;
    }

    function render() {
      listDiv.innerHTML = '';
      var completedCount = 0;

      data.forEach(function(item, index) {
        if (savedProgress[index]) completedCount++;
      });

      var startIndex = (currentPage - 1) * PAGE_SIZE;
      var endIndex = Math.min(startIndex + PAGE_SIZE, data.length);
      var pageData = data.slice(startIndex, endIndex);

      // 1) 현재 페이지의 첫 문장에서 유효한 섹션 제목을 추적하여 생성
      var activeTitle = findCurrentSectionTitle(startIndex);
      if (activeTitle) {
        var topH2 = document.createElement('h2');
        topH2.className = 'section-header';
        topH2.innerText = activeTitle;
        listDiv.appendChild(topH2);
      }

      // 2) 페이지 아이템들 출력
      pageData.forEach(function(item, i) {
        var realIndex = startIndex + i;
        var isChecked = savedProgress[realIndex] || false;

        // 첫 번째 문장이 아니고, 중간에 새로운 sectionTitle이 나오는 경우에만 추가로 헤더 표시
        if (i > 0 && item.sectionTitle) {
          var midH2 = document.createElement('h2');
          midH2.className = 'section-header';
          midH2.innerText = item.sectionTitle;
          listDiv.appendChild(midH2);
        }

        var div = document.createElement('div');
        div.className = 'item' + (isChecked ? ' completed' : '');
        
        div.innerHTML = 
          '<div class="item-check">' +
            '<input type="checkbox" ' + (isChecked ? 'checked' : '') + ' data-index="' + realIndex + '">' +
          '</div>' +
          '<div class="item-content">' +
            '<div class="jp-text">' + item.num + '. ' + item.kanji + '</div>' +
            '<div class="reading-text">📖 ' + item.kana + '</div>' +
            '<div class="ko-text">💡 ' + item.kr + '</div>' +
          '</div>' +
          '<button class="btn sound-btn" data-file="' + item.audio + '">🔊 소리</button>';

        listDiv.appendChild(div);
      });

      var percent = Math.round((completedCount / data.length) * 100) || 0;
      progressText.innerText = '고급 진행률: ' + completedCount + ' / ' + data.length + ' (' + percent + '%)';

      renderPagination();
    }

    function renderPagination() {
      paginationDiv.innerHTML = '';
      var totalPages = Math.ceil(data.length / PAGE_SIZE);

      if (totalPages <= 1) return;

      var prevBtn = document.createElement('button');
      prevBtn.className = 'page-btn';
      prevBtn.innerText = '이전';
      prevBtn.disabled = (currentPage === 1);
      prevBtn.onclick = function() { currentPage--; render(); window.scrollTo(0, 0); };
      paginationDiv.appendChild(prevBtn);

      for (var p = 1; p <= totalPages; p++) {
        (function(pageNum) {
          var btn = document.createElement('button');
          btn.className = 'page-btn' + (pageNum === currentPage ? ' active' : '');
          btn.innerText = pageNum;
          btn.onclick = function() {
            currentPage = pageNum;
            render();
            window.scrollTo(0, 0);
          };
          paginationDiv.appendChild(btn);
        })(p);
      }

      var nextBtn = document.createElement('button');
      nextBtn.className = 'page-btn';
      nextBtn.innerText = '다음';
      nextBtn.disabled = (currentPage === totalPages);
      nextBtn.onclick = function() { currentPage++; render(); window.scrollTo(0, 0); };
      paginationDiv.appendChild(nextBtn);
    }

    document.addEventListener('click', function(e) {
      if (e.target && e.target.classList.contains('sound-btn')) {
        var rawFile = e.target.getAttribute('data-file');
        var cleanFile = String(rawFile).replace(/[\u200B-\u200D\uFEFF\u00A0]/g, '').trim();

        player.pause();
        player.src = './audio/' + cleanFile;
        player.load();
        
        var playPromise = player.play();
        if (playPromise !== undefined) {
          playPromise.catch(function(err) {
            alert('오디오를 재생할 수 없습니다. audio 폴더에 ' + cleanFile + ' 파일이 있는지 확인해 주세요.');
          });
        }
      }

      if (e.target && e.target.type === 'checkbox') {
        var idx = e.target.getAttribute('data-index');
        savedProgress[idx] = !savedProgress[idx];
        localStorage.setItem('my_study_progress_advanced', JSON.stringify(savedProgress));
        render();
      }
    });

    document.getElementById('jumpBtn').onclick = function() {
      var targetIndex = -1;
      for (var i = 0; i < data.length; i++) {
        if (!savedProgress[i]) {
          targetIndex = i;
          break;
        }
      }

      if (targetIndex !== -1) {
        currentPage = Math.floor(targetIndex / PAGE_SIZE) + 1;
        render();
        window.scrollTo(0, 0);
      } else {
        alert('🎉 고급 과정의 모든 문장 공부를 완료하셨습니다!');
      }
    };

    render();
  </script>
